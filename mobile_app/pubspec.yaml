name: mobile_app
description: "A premium mobile booking application for Nowhere Nest stays, rides, and vibes."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  provider: ^6.0.5
  video_player: ^2.8.2
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  shared_preferences: ^2.2.2
  lucide_icons: ^0.320.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
